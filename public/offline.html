<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Offline · Nokael Dispatch</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f4f1; --card: #fff; --text: #151516; --muted: #6b6b72; --accent: #d7ff3a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0c; --card: #17171a; --text: #f5f5f2; --muted: #9a9aa2; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
    main { width: min(380px, 100%); padding: 28px 24px; border-radius: 20px; background: var(--card); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { margin: 16px 0 6px; font-size: 20px; font-weight: 600; }
    p { margin: 0 0 20px; color: var(--muted); font-size: 15px; }
    button { min-height: 48px; width: 100%; border: 0; border-radius: 999px; background: var(--accent); color: #151516; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Nokael Dispatch needs a connection to load live jobs. It will open as soon as you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
